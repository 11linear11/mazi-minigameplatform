services:
  backend:
    build:
      dockerfile: server.Dockerfile
      context: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    volumes:
      - mazi-data:/app/server/data
      - mazi-avatars:/app/server/public/avatars
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - API_INTERNAL_URL=http://backend:4000
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mazi-data:
  mazi-avatars:
